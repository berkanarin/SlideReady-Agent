name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress ffmpeg fonts-liberation
      - name: Python and Node packages
        run: |
          python -m pip install -r requirements.txt
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Doctor
        run: bin/slideready doctor
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: Preview demo deck
        run: bin/slideready preview examples/demo.pptx --slides 1,3
      - name: Export demo deck (720p)
        run: bin/slideready export examples/demo.pptx --quality 720 -o demo-SlideReady.pptx
      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: |
            demo-SlideReady.pptx
            examples/demo.slideready/preview/
