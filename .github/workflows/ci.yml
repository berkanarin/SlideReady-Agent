name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Slaytları PowerPoint (Windows, COM) çizer; Linux'ta çizim testleri atlanır, saf Python testleri çalışır.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python packages
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: Analyze demo deck
        run: bin/slideready analyze examples/demo.pptx
